  - title: "Light the World Giving Machine – Campus Martius, Detroit"
    body: "Visit Detroit's Giving Machine at Campus Martius, November 14 – December 6. 100% of donations go to the charity of your choice. The QR codes on the flyer link to the Giving Machine's Facebook and Instagram (givingmachine_detroit)."

