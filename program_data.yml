    body: "Singers of all ages (Primary and up) are needed for the December 6 stake conference general session musical number, \"Tuya Es La Gloria,\" sung in English and Spanish. Practices are Sundays, November 15, 22, and 29, 4–5 p.m., at the Farmington Hills chapel. Stake Music Coordinator: Brother Brett Rowberry (message relayed by Justin Wong)."
    link: "https://www.youtube.com/watch?v=1Xa_rtbCGow"

