text_announcements:
  - title: "Family History & Temple Work Lunch and Learn"
    body: "Saturday, August 22, 2026, from 10:00 a.m. to 2:00 p.m. at the Farmington Hills Stake Center. The Commerce Ward Temple and Family History Committee invites all Farmington Hills Stake members — beginners and experienced researchers alike. Classes may include first steps in temple and family history, digitizing photos and documents, family spotlights, and family storybooks. Please bring your own lunch and a laptop or tablet with internet access if available."

  - title: "Ward Temple Night"
    body: "Beginning this month, Ward Temple Night has been rescheduled to the third Friday of each month (instead of the third Thursday). Come serve together in the house of the Lord."

  - title: "LIVE Youth Music Festival"
    body: "Saturday, August 22, 2026, 6:00–9:00 p.m. at the LaFontaine Family Amphitheater, 195 N Main St, Milford, MI. Hosted by Farmington Hills Stake youth. Casual dress. All youth turning 12 and older are invited; friends welcome. Uplifting songs from the youth album, refreshments, and FSY line dancing after."

  - image: "/images/youth-music-festival.jpg"
    alt: "LIVE Youth Music Festival — Saturday August 22, 2026, 6:00–9:00 p.m. at the LaFontaine Family Amphitheater, 195 N Main St, Milford, MI. Hosted by Farmington Hills Stake youth."

  - title: "Sunday Class Schedule Changes – September 2026"
    url: "https://www.churchofjesuschrist.org/feature/sunday-meeting-schedule?lang=eng"
    body: "Beginning the first week of September 2026, the Sunday class schedule will change. Sacrament meeting continues at 60 minutes, followed by a weekly 25-minute Sunday School class and a 25-minute Elders Quorum, Relief Society, or Young Women meeting. Primary will continue weekly and last 55 minutes."

  - title: "Relief Society Stake Temple Day"
    body: "All sisters are invited to the Farmington Hills Stake Relief Society Temple Day on Saturday, September 19, 2026. Watch for the invitation flyer with details, and plan to attend!"

  - title: "Relief Society & Young Women FamilySearch Activity"
    body: "Saturday, September 26, 2026, from 10:00 a.m. to noon at the Clarkston church building. Young Women and Relief Society join for a morning of discovering family through FamilySearch. Laptops provided; bring your own if you prefer. Daycare: Sis. Leelannee Godfrey or Sis. Nancy Castro."

  - image: "/images/discover-family-with-me.jpg"
    alt: "Discover Family With Me — Relief Society and Young Women FamilySearch activity, Saturday September 26, 2026, 10 a.m.–noon, Clarkston building"

  - title: "Light of the World — Relief Society Christmas Workshop"
    body: "Combined Clarkston and White Lake Wards. Saturday, October 10, 9:00 a.m. to 1:30 p.m. Save the date. More information coming shortly."

  - image: "/images/light-of-the-world.png"
    alt: "Light of the World — Relief Society Christmas Workshop save-the-date flyer. Combined Clarkston and White Lake Wards, Saturday October 10, 9:00 a.m. to 1:30 p.m."

  - title: "Winter Clothing Giveaway"
    body: "Farmington Hills Stake Center, 33900 13 Mile Rd. Friday, October 16, 2026, 9:00 a.m.–7:00 p.m. (voucher only). Saturday, October 17, 9:00 a.m.–noon (open to the public). Coat drive through September 30 — bring lightly worn coats to church. Sign up to help: https://www.signupgenius.com/go/20F0E49ADA829A1F94-64959790-2026 Vouchers: fh.ward.mi@gmail.com"

  - image: "/images/winter-clothing-giveaway.jpg"
    alt: "Winter Clothing Giveaway — Farmington Hills Stake Center, 33900 13 Mile Rd. Friday October 16, 2026, 9:00 a.m.–7:00 p.m. (voucher only); Saturday October 17, 9:00 a.m.–noon (open to the public)."

  - title: "Young Married Couples Class"
    body: "Ann Arbor Institute, 914 Hill St. Young married couples ages 18–35. Friday nights August 28, September 25, and October 30: dinner 6:00–6:30, lesson 6:30–7:30, games 7:30–8:30. Contact Brother Scott Grimes, grimessm@churchofjesuschrist.org."

  - image: "/images/young-married-couples.png"
    alt: "Young Married Couples Class — Ann Arbor Institute, 914 Hill St. Friday nights August 28, September 25, and October 30, 2026."

  - title: "Finding Strength in the Lord — Emotional Resilience Class"
    body: "Weekly Zoom class beginning Sunday, September 13, 2026, through November 15, 6:30–8:00 p.m. To join, email Sister Rebecca Behrends at sisterrbehrends@gmail.com with name, email, cell, and ward. Course manual required from the Church store."

  - title: "Keith Erekson — October 10–11"
    body: "Farmington Hills Stake Center, 33900 Thirteen Mile Rd. Saturday, October 10: Seminary and Institute teacher training 10:00–11:30 a.m., stake leadership training 5:00–6:30 p.m., adult devotional 7:00–8:30 p.m. Sunday, October 11: youth devotional 6:00–7:30 p.m."

  - image: "/images/keith-erekson.png"
    alt: "Keith Erekson — Farmington Hills Stake Center, October 10–11, 2026. Seminary and Institute teacher training, stake leadership training, adult and youth devotionals."

  - banner: "Ward Temple and Family History Plan"
    body: |
      DISCOVER — Find out who your family members are.
      GATHER — Collect names and information of family members and ancestors and add them to your family tree.
      UNITE — Attend the Temple. Unite yourself and your ancestors to the Lord. Seal families together for eternity.

      Ward Temple and Family History Leader: Bro. John Tremonti — jtcarwash@comcast.net
