text_announcements:
  - title: "Ward Temple Night"
    body: "Ward Temple Night has been rescheduled to the third Friday of each month (instead of the third Thursday). Come serve together in the house of the Lord."

  - title: "Clarkston Ward Annual Primary Program — October 18"
    body: "Sunday, October 18, 2026, during sacrament meeting at 9:00 a.m. The Primary children will share their annual Children's Sacrament Meeting Presentation with songs and messages. Families and all ward members are invited to come and support the children. Primary families: please help your children practice their parts and the songs at home."

  - title: "Giving Machine Volunteer Signup"
    body: "The Light the World Giving Machine returns to Campus Martius in Detroit, November 14 – December 6, 2026. Volunteer shifts are open to members and the public and will be posted on JustServe until October 18 — time to sign up is limited. Sign up on JustServe: https://www.justserve.org/projects/a7579f5a-7391-47d9-9b1f-0619cabc78af"

  - image: "images/giving-machine-2026.png"
    alt: "Light the World Giving Machine — Campus Martius, Detroit, November 14 – December 6, 2026. Volunteer sign-ups on JustServe until October 18."

  - title: "Clarkston Ward Spook-tacular & Trunk-or-Treat — October 24"
    body: "Saturday, October 24, 2026, at the Clarkston Building, 6454 Waterford Rd. Costumes are encouraged. Dinner is at 6:00 p.m. (5:45 p.m. if you are bringing food), followed by a costume parade at 6:45, dinner clean up and trunk-or-treat set up at 7:00, and trunk or treat at 7:15. Trunk decorators can set up anytime between 4:00 and 6:00 p.m. There will be a chili cook-off with prizes. Sign up to enter chili or bring a side, salad or cornbread: https://www.signupgenius.com/go/70A0C4AAAA828A3F58-66623822-clarkston#/ Questions: Parker Price, 801-910-9304."

  - image: "images/spooktacular-2026.png"
    alt: "Clarkston Ward Spook-tacular & Trunk or Treat — Saturday, October 24, 2026, Clarkston Building, 6454 Waterford Rd. Dinner 6:00 PM, costume parade 6:45, trunk or treat 7:15. Chili cook-off. Scan to sign up."

  - title: "Valiant Activity Boys and Girls: Fire Station Tour"
    body: "Combined boys and girls activity. Tuesday, October 27, 7:00–8:00 PM. Boys and girls will meet at Independence Township Fire Station #1, 6500 Citation Dr., Clarkston. Please plan drop-off and pick-up at the station."

  - title: "Young Married Couples Class"
    body: "Ann Arbor Institute, 914 Hill St. Young married couples ages 18–35. Friday night October 30: dinner 6:00–6:30, lesson 6:30–7:30, games 7:30–8:30. Contact Brother Scott Grimes, grimessm@churchofjesuschrist.org."

  - image: "images/young-married-couples.png"
    alt: "Young Married Couples Class — Ann Arbor Institute, 914 Hill St. Friday night October 30, 2026."

  - title: "2026 Clarkston Ward Tithing Declaration"
    body: "Tithing Declaration is occurring from September 13 – November 8; most Sundays after the meeting block and Thursday evenings. Please access the SignUp Genius to see available times and reserve a slot for your family: https://www.signupgenius.com/go/10C0B49A8AE2BAAFAC34-65479167-clarkston Please reach out to Brother Tanner Bean with any questions, or if you need assistance reserving a time."

  - title: "Find a Better Job — Self-Reliance Class"
    body: "Weekly Zoom class beginning Sunday, September 27, 2026, through November 29, 6:30 p.m. Learn to identify opportunities, network, present yourself professionally, and prepare for interviews. To join, email Sister Susan Locke at sisterslocke@churchofjesuschrist.org with name, email, and ward. Course manual required from the Church store: https://store.churchofjesuschrist.org/find-a-better-job/5638682636.p"

  - banner: "Ward Temple and Family History Plan"
    body: |
      DISCOVER — Find out who your family members are.
      GATHER — Collect names and information of family members and ancestors and add them to your family tree.
      UNITE — Attend the Temple. Unite yourself and your ancestors to the Lord. Seal families together for eternity.

      Ward Temple and Family History Leader: Bro. John Tremonti — jtcarwash@comcast.net
